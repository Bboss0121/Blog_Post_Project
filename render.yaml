# Render deployment config (https://render.com/docs/reference/render-yaml)
# Create this file, commit it, and deploy from the Render dashboard:
#   New Web Service → select repo → "Apply render.yaml"

databases:
  - name: blog-db
    plan: free
    postgresDatabase: blogdb
    postgresUser: bloguser

services:
  - type: web
    name: blog-post-project
    plan: free
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          databaseName: blogdb
          userName: bloguser
      # Set SECRET_KEY to a long random value (e.g. `python -c "import secrets; print(secrets.token_hex(32))"`)
      - key: SECRET_KEY
        sync: false